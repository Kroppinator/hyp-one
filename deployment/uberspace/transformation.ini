; Dienst-Konfiguration für Uberspace.
;
; Diese Datei gehört auf dem Server nach:
;   ~/etc/services.d/transformation.ini
;
; Sie steht hier als Vorlage im Repository, damit nachvollziehbar bleibt,
; wie der Dienst eingerichtet ist. Die ausgefüllte Fassung auf dem Server
; enthält das Postfach-Passwort und darf NICHT ins Repository zurück.
;
; Nach dem Anlegen oder Ändern:
;   supervisorctl reread && supervisorctl update
;   supervisorctl status transformation

[program:transformation]

; BENUTZER durch den eigenen Uberspace-Benutzernamen ersetzen.
directory=/home/BENUTZER/app
command=node server.js

autostart=true
autorestart=true

; Next braucht einen Moment, bis es Anfragen annimmt. Ohne startsecs
; würde supervisord einen langsamen Start für einen Absturz halten.
startsecs=15

; Ohne diese beiden Zeilen bleiben beim Neustart Kindprozesse zurück,
; die den Port weiter belegen – der Neustart scheitert dann stillschweigend.
stopasgroup=true
killasgroup=true

; HOSTNAME auf 127.0.0.1 binden: Der Dienst soll nur lokal erreichbar sein.
; Nach außen stellt ihn der Webserver von Uberspace zu (siehe ANLEITUNG.md).
;
; Die EMAIL_-Werte sind die Zugangsdaten des Postfachs. Sie stehen bewusst
; nur hier auf dem Server. Datei anschließend absichern:  chmod 600
;
; WICHTIG: EMAIL_FROM muss dieselbe Adresse sein wie EMAIL_USER. GMX lehnt
; den Versand unter einer fremden Absenderadresse ab – die Anfrage scheitert
; dann mit einem nichtssagenden Fehler 500.
;
; Zum Testen dürfen USER, FROM und TO auf ein anderes Postfach zeigen. Vor
; dem Livegang alle vier Zeilen auf Isabelles Postfach umstellen, sonst
; landen die Anfragen weiterhin beim Tester.
environment=
    NODE_ENV="production",
    PORT="3000",
    HOSTNAME="127.0.0.1",
    EMAIL_HOST="smtp.gmx.net",
    EMAIL_PORT="587",
    EMAIL_SECURE="false",
    EMAIL_USER="isabelle-kroppenstedt@gmx.de",
    EMAIL_PASSWORD="HIER-DAS-POSTFACH-PASSWORT",
    EMAIL_FROM="isabelle-kroppenstedt@gmx.de",
    EMAIL_TO="isabelle-kroppenstedt@gmx.de"
